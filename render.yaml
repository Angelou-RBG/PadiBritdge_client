services:
  - type: web
    name: padibridge-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_URL
        sync: false
      - key: DB_PATH
        value: /var/data/PadiBridge.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: padibridge-data
      mountPath: /var/data
      sizeGB: 1